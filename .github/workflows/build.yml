name: Build

on:
  push:
  pull_request_target:
    types: [labeled]
  workflow_dispatch: # Allow manual trigger

jobs: 
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: Build APK
        run: bash ./gradlew assembleRelease --stacktrace --info
      - name: Debug APK Path
        run: find . -type f -name "*.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: unsigned-apks
          path: |
            ./presentation/build/outputs/apk/fdroid/release/presentation-fdroid-release-unsigned.apk
            ./presentation/build/outputs/apk/lite/release/presentation-lite-release-unsigned.apk
            ./presentation/build/outputs/apk/accrescent/release/presentation-accrescent-release-unsigned.apk
            ./presentation/build/outputs/apk/apkstore/release/presentation-apkstore-release-unsigned.apk
            ./presentation/build/outputs/apk/playstore/release/presentation-playstore-release-unsigned.apk
